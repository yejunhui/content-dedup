[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "content-dedup"
version = "0.2.0"
description = "Multi-modal content deduplication with layered exact and perceptual fingerprints"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
semantic = [
    "torch>=2.2",
    "open-clip-torch>=2.24",
    "sentence-transformers>=3.0",
]

[project.scripts]
dedup = "dedup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dedup = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "integration: tests that invoke external binaries such as ffmpeg",
]
