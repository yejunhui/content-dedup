name: Feature request
description: Suggest an idea or improvement
title: "[Feature] "
labels: ["enhancement", "triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the user scenario, not only the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web UI
        - CLI
        - Image detection
        - Video detection
        - Audio detection
        - Document/text detection
        - Archive detection
        - Performance / NAS
        - Docker / deployment
        - Documentation
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This feature should not make duplicate cleanup more aggressive by default.
          required: true
