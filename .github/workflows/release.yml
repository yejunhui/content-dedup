name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES="docs/releases/${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f "$NOTES" ]; then
              gh release edit "$TAG" \
                --title "ContentDedup $TAG" \
                --notes-file "$NOTES"
            else
              echo "Release $TAG already exists"
            fi
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" \
              --title "ContentDedup $TAG" \
              --notes-file "$NOTES"
          else
            gh release create "$TAG" \
              --title "ContentDedup $TAG" \
              --generate-notes
          fi
