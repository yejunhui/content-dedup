name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libchromaprint-tools

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint Python
        run: ruff check src tests examples

      - name: Check JavaScript syntax
        run: node --check src/dedup/web/static/app.js

      - name: Run tests
        run: pytest -q

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t content-dedup:ci .
      - name: Verify CLI inside image
        run: docker run --rm content-dedup:ci dedup --version
