# ContentDedup default configuration.
# Every value below is optional; omitted keys use the built-in defaults.

scan:
  # Glob patterns matched against the relative path and the basename.
  exclude:
    - .git
    - .svn
    - .hg
    - "@eaDir"
    - "#recycle"
    - node_modules
    - __pycache__
    - .dedup
    - .dedup-trash
    - .venv
    - venv
    - "*.tmp"
    - "~$*"
  workers: 1
  min_size: 1
  follow_symlinks: false
  progress_every: 200

image:
  # phash (default) or dhash
  algorithm: phash
  hash_size: 8
  phash_threshold: 8
  dhash_threshold: 8
  # Reject pHash/dHash matches whose 4x4x4 RGB histograms differ too much.
  color_threshold: 0.85

video:
  frame_interval: 5.0
  max_frames: 240
  hash_size: 8
  phash_threshold: 10
  duration_tolerance: 0.2
  color_threshold: 0.8
  # Safety valve for very large video libraries.
  max_pair_comparisons: 200000
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  timeout: 600

audio:
  enabled: true
  # Requires the chromaprint fpcalc binary (Debian: libchromaprint-tools).
  fpcalc: fpcalc
  length: 120
  min_score: 0.9
  duration_tolerance: 0.15
  max_shift: 30
  min_overlap: 40
  # Safety valve for very large audio libraries.
  max_pair_comparisons: 200000
  timeout: 60

document:
  simhash_hamming: 3
  min_tokens: 20
  max_chars: 2000000
  max_pages: 500

text:
  simhash_hamming: 3
  min_tokens: 20
  max_bytes: 4000000

archive:
  max_entries: 5000
  max_uncompressed_bytes: 2000000000
  max_inner_hash_bytes: 2000000000

semantic:
  # Reserved for the optional third layer; not implemented in this version.
  enabled: false
  model: ""
  cosine_threshold: 0.92

safety:
  # oldest | newest | largest | shortest_path
  keep: oldest
  # Relative to the scanned root unless absolute.
  trash_dir: .dedup-trash
  verify_on_apply: true

storage:
  database: .dedup/cache.sqlite3
  report: .dedup/reports/latest.json
